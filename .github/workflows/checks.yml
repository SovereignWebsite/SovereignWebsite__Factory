name: Checks
# Every pull request to dev and every push to dev. Read-only token; no secrets.
on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node test/run.mjs
      - run: node build/abp.mjs validate
      - run: node build/leak-scan.mjs
      - name: Signed commits and policy paths (pull requests)
        if: github.event_name == 'pull_request'
        run: |
          node build/check-signatures.mjs ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}
          node build/abp.mjs paths ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}
      - name: Policy paths for a push to dev
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: node build/abp.mjs paths ${{ github.event.before }} ${{ github.event.after }}
      - name: Dry plan of the organisation
        run: node build/org-plan.mjs plan.json >> "$GITHUB_STEP_SUMMARY" && node build/abp.mjs actions plan.json
